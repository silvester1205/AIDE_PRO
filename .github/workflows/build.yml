name: Build AIDE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install PyQt6 pymupdf pandas openpyxl pillow openai pyinstaller

      - name: Build AIDE Pro
        run: pyinstaller --onefile --windowed --name "AIDE_Pro" --add-data "utils:utils" aide.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AIDE-Mac-Pro
          path: "dist/AIDE_Pro"
